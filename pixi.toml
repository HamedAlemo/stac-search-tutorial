[workspace]
name = "stac-search-tutorial"
description = "Tutorial for using a STAC API and searching for satellite scenes"
authors = ["Hamed Alemohammad"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.13.*"
numpy = "*"
jupyterlab = "*"
matplotlib = "*"
requests = "*"
pillow = "*"
pystac-client = "0.9.0.*"
rioxarray = "0.23.0.*"
leafmap = "0.63.1.*"

[tasks]
lab = "jupyter lab"
